<title id="t">AK Base Kit: trên bo có gì</title><desc id="d">Sơ đồ khối của bo: vi điều khiển STM32L151CBT6 ở giữa, quanh nó là nguồn, mạch USB-UART, cổng nạp, màn hình OLED, flash SPI, RTC, RS485, ba nút bấm, còi, LED và các cổng mở rộng.</desc>
