# ak-mcu-base: host unit tests + simulator OTA test, and the STM32L151 build
# (both staging modes) with a bootloader size budget.
name: ak-mcu-base

on:
  push:
    paths-ignore: ['legacy/**', 'docs/**', '*.md']
  pull_request:
    paths-ignore: ['legacy/**', 'docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # ASan needs a smaller ASLR range than some runner kernels default to
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build
        run: cmake -S . -B build/host && cmake --build build/host -j
      - name: Unit tests + simulator OTA
        run: ctest --test-dir build/host --output-on-failure -LE fast_only

  # the firmware as WebAssembly (docs/play): only checks that it still builds;
  # the published copy in docs/play is built locally and committed
  web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build
        run: |
          emcc --version | head -1
          python3 src/port/web/build.py --out build/play
          test -s build/play/ak-kit.js && test -s build/play/index.html

  stm32-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build every STM32L151 variant (staging, signed, Modbus roles, demo, kit_tools, remote, rc_tx, rc_rx, fc)
        run: |
          arm-none-eabi-gcc --version | head -1
          pip install cryptography
          python3 tools/ak_sign.py devkey
          make stm32-all
      - name: Size budget
        run: |
          cd build
          ls -l stm32l151/boot.bin stm32l151/app.img stm32l151-internal/boot.bin stm32l151-internal/app.img stm32l151-sign/boot.bin stm32l151-sign/app.img
          # BOOT partition is 12288 B (16384 B with signed images); keep 2K headroom for fixes in the field
          for f in stm32l151/boot.bin stm32l151-internal/boot.bin; do
            s=$(stat -c %s "$f"); echo "$f: $s B"
            [ "$s" -le 10240 ] || { echo "bootloader over the 10240 B budget"; exit 1; }
          done
          s=$(stat -c %s stm32l151-sign/boot.bin); echo "stm32l151-sign/boot.bin: $s B"
          [ "$s" -le 14336 ] || { echo "signed bootloader over the 14336 B budget"; exit 1; }
          python3 ../tools/mkimage.py info stm32l151-sign/app.img --pub ../tools/keys/dev_pub.pem
          # RAM: what .data/.bss leave for heap + stack (the linker already keeps
          # 2K of stack); below 3K a deeper call chain overwrites the heap
          for d in stm32l151 stm32l151-internal stm32l151-sign stm32l151-gateway stm32l151-mbmaster \
                   stm32l151-demo stm32l151-kit_tools stm32l151-remote stm32l151-rc_tx stm32l151-rc_rx stm32l151-fc; do
            heap=$(arm-none-eabi-size -A $d/app.elf | awk '$1 == "._heap" { print $2 }')
            free=$((heap + 2048)); echo "$d/app.elf: $free B for heap + stack"
            [ "$free" -ge 3072 ] || { echo "$d: less than 3072 B of RAM left for heap + stack"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ak-mcu-base-stm32l151
          path: |
            build/stm32l151/boot.bin
            build/stm32l151/app.img
            build/stm32l151/*.elf
            build/stm32l151-demo/app.img
            build/stm32l151-demo/app.elf

  # second port: STM32G071 built with the same toolchain, then the real .elf
  # files run in the Renode emulator (bootloader -> app -> shell)
  stm32g071-renode:
    runs-on: ubuntu-24.04
    env:
      RENODE_VERSION: 1.15.3
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build
        run: |
          make stm32g0
          ls -l build/stm32g071/boot.bin build/stm32g071/app.img
      - name: Renode
        run: |
          wget -q https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz
          mkdir renode && tar xzf renode-${RENODE_VERSION}.linux-portable.tar.gz -C renode --strip-components=1
          pip install robotframework==6.1 psutil pyyaml
      - name: Run in the emulator
        run: renode/renode-test --results-dir build/renode tests/renode/stm32g071.robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ak-mcu-base-stm32g071
          path: |
            build/stm32g071/boot.bin
            build/stm32g071/app.img
            build/stm32g071/*.elf
            build/renode/*.html
