; ==============================================================================
; ak-mcu-base - PlatformIO (STM32L151CB, bare-metal, SPL in third_party/stm32l1)
;
;   pio run -e boot -t upload        ; bootloader @ 0x08000000
;   pio run -e app  -t upload        ; app (.elf already carries a valid header)
;   -> .pio/build/app/app.img        ; OTA image for tools/ak_fw.py
;
; NOTE: CMake is the reference build (verified in CI/cloud). This file mirrors
; src/port/stm32l151/port.cmake; keep both in sync when adding sources.
; ==============================================================================

[platformio]
default_envs = app
src_dir = src
boards_dir = src/port/stm32l151/boards

[common]
; OTA staging: 1 = external W25Qxx (APP 116K), 0 = internal flash (APP 58K).
; Read by tools/pio_mcu_base.py as well (APP partition size for the linker check).
staging_external = 1
; 1 = AK Base Kit with an nRF24 module in the socket (holds its CSN, PB9, high)
kit_nrf24 = 0
; 1 = bootloader also runs an APP without image header (raw SWD flash, debug)
boot_allow_raw_app = 0
; 1 = images must carry an ECDSA P-256 signature (bootloader 16K, APP from
; 0x08004000); mkimage signs with sign_key. See src/services/fw/fw_sign.h.
image_sign = 0
; not in the repository: python tools/ak_sign.py devkey makes it (tools/keys/ is git-ignored)
sign_key = tools/keys/dev_priv.pem
; SPL/CMSIS, outside src_dir: tools/pio_mcu_base.py builds the SPL sources
spl = third_party/stm32l1
app_version_flags =
    -DAPP_VER_MAJOR=1
    -DAPP_VER_MINOR=3
    -DAPP_VER_PATCH=10
    -DAPP_VER_BUILD=0

; sources shared by boot and app (kept here: [env] only accepts PlatformIO options)
src_filter_port =
    +<port/stm32l151/startup.c>
    +<port/stm32l151/port_stm32l151.c>
    +<port/stm32l151/system_stm32l1xx.c>
    +<port/stm32l151/spi_nor.c>
    +<common/*.c>
    +<services/fw/*.c>

; flags and sources of the app envs (Modbus role is added per env)
; AK_DYNAMIC_MSG_POOL_SIZE=0: no dynamic messages, no malloc/free (same as APP_KERNEL_DEFS in CMakeLists.txt)
app_flags =
    -Isrc/app -Isrc/services/modbus -Ithird_party/nanomodbus -DNMBS_STRERROR_DISABLED
    -DAK_DYNAMIC_MSG_POOL_SIZE=0
app_src_filter =
    -<*>
    ${common.src_filter_port}
    +<port/stm32l151/fw_header.c>
    +<port/stm32l151/rs485.c>
    +<port/stm32l151/rf_test.c>
    +<kernel/src/*.c>
    +<services/sys/*.c>
    +<services/modbus/*.c>
    +<../third_party/nanomodbus/*.c>
    +<app/*.c>

[env]
platform = ststm32
board = genericSTM32L151CB_bare
framework =
upload_protocol = stlink
monitor_speed = 115200
extra_scripts = pre:tools/pio_mcu_base.py

build_unflags = -std=gnu11 -std=gnu++11
build_flags =
    -std=gnu99
    -mcpu=cortex-m3 -mthumb -mfloat-abi=soft
    -Os -g -flto -ffunction-sections -fdata-sections
    -Wall -Wextra -Wno-unused-parameter -Wshadow -Wundef -Wdouble-promotion -Werror
    -DUSE_STDPERIPH_DRIVER -DSTM32L1XX_MD
    ${common.app_version_flags}
    -DPORT_STAGING_EXTERNAL=${common.staging_external}
    -DPORT_KIT_NRF24_CSN=${common.kit_nrf24}
    -DBOOT_ALLOW_RAW_APP=${common.boot_allow_raw_app}
    -DPORT_IMAGE_SIGN=${common.image_sign} -DFW_IMAGE_SIGN=${common.image_sign}
    -Ithird_party/p256-m
    -Isrc/kernel/inc -Isrc/common -Isrc/hal -Isrc/services/fw -Isrc/services/sys -Isrc/boot -Isrc/port/stm32l151
    -I${common.spl}/STM32L1xx_StdPeriph_Driver/inc
    -I${common.spl}/CMSIS/Device/ST/STM32L1xx/Include
    -I${common.spl}/CMSIS/Include

[env:boot]
board_build.ldscript = src/port/stm32l151/boot.ld
board_upload.maximum_size = 16384
build_flags = ${env.build_flags} -DAK_BOOTLOADER
build_src_filter =
    -<*>
    ${common.src_filter_port}
    +<boot/*.c>

[env:app]
; sample app, Modbus SLAVE on RS485 (register map + firmware update over RS485)
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
build_src_filter = ${common.app_src_filter}

[env:app_mbmaster]
; same app, Modbus MASTER (shell: mb read / mb write). One RS485 port, one role.
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_MASTER -DNMBS_SERVER_DISABLED
build_src_filter = ${common.app_src_filter}

[env:app_gateway]
; Modbus TCP server on a W5500 module plugged into J6 (chip select PA4),
; forwarding to the RS485 slaves as RTU master. Address: APP_NET_* in app.h.
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_GATEWAY
build_src_filter = ${common.app_src_filter}
    +<port/stm32l151/w5500.c>

[env:demo]
; AK Base Kit demo on top of the slave app: menu, clock, six games, 3D, maze,
; jukebox, video from the SPI flash, weather station, system monitor on the
; OLED + 3 buttons + buzzer + SHT45 (demo/, port/stm32l151/kit.c)
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
    -DAPP_KIT_DEMO -Isrc/demo
build_src_filter = ${common.app_src_filter}
    +<demo/*.c>
    +<port/stm32l151/kit.c>

[env:kit_tools]
; the demo plus bench tools for the kit, too heavy for the normal demo:
;   spi   SPI sniffer on the J6 pins (5.6 KB of RAM for the capture)
;   rf    nRF24L01+ on J6: listen on a channel, send test frames
;   fcb   flight control bench, P0 of docs/drone-ak-mcu.md (src/fc)
; ("i2c", the scanner of the I2C header, is in every demo build)
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_flags = ${env:demo.build_flags}
    -DAPP_KIT_SPI_SNIFF -DAPP_RF_TEST -DAPP_FC_BENCH -Isrc/fc
build_src_filter = ${env:demo.build_src_filter}
    +<fc/*.c>
    +<port/stm32l151/fc_bench.c>

[env:remote]
; bench remote for a 2.4 GHz toy drone on the AK Base Kit 2.1 (STM32L151C8, 64K,
; nRF24L01+ and a 0.96" SSD1306 on the board): the OLED menu and the 3 buttons
; choose what goes into the control packet, the nRF24 sends it (remote/,
; port/stm32l151/rf_test.c). No demo screens: it must stay below 52K, the 64K
; of the chip minus the bootloader.
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 53248
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
    -DAPP_RF_TEST -DAPP_REMOTE -DKIT_LCD_SSD1306 -Isrc/demo -Isrc/remote
build_src_filter = ${common.app_src_filter}
    +<demo/gfx.c>
    +<remote/*.c>
    +<port/stm32l151/kit.c>

[env:rc_tx]
; remote with sticks for the ak-mcu receiver, P1 of docs/drone-ak-mcu.md: an
; nRF24L01+ in J6 (CE PA8, CSN PA4), an ADS1115 on I2C1 (J7) for 2 joysticks
; (without it: "link stick" from the shell), OLED + 3 buttons + buzzer
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_unflags = -DPORT_KIT_NRF24_CSN=${common.kit_nrf24}
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
    -UPORT_KIT_NRF24_CSN -DPORT_KIT_NRF24_CSN=1
    -DAPP_RC_TX -Isrc/demo -Isrc/rc
build_src_filter = ${common.app_src_filter}
    +<demo/gfx.c>
    +<rc/*.c>
    +<port/stm32l151/kit.c>
    +<port/stm32l151/nrf24.c>

[env:rc_rx]
; the receiver of rc_tx (same hardware: nRF24 in J6), the radio half of the
; future flight controller: follows the hopping, telemetry in the ACK, arming
; and failsafe; shows what the motors would get
board_build.ldscript = src/port/stm32l151/app.ld
board_upload.maximum_size = 118784
build_unflags = -DPORT_KIT_NRF24_CSN=${common.kit_nrf24}
build_flags = ${env.build_flags} ${common.app_flags}
    -DAPP_MODBUS_SLAVE -DNMBS_CLIENT_DISABLED
    -UPORT_KIT_NRF24_CSN -DPORT_KIT_NRF24_CSN=1
    -DAPP_RC_RX -Isrc/demo -Isrc/rc
build_src_filter = ${common.app_src_filter}
    +<demo/gfx.c>
    +<rc/*.c>
    +<port/stm32l151/kit.c>
    +<port/stm32l151/nrf24.c>
